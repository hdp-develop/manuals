<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사용자 매뉴얼</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      line-height: 1.6;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    header {
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 16px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
    }
    .lead {
      color: #555;
      margin: 0;
    }
    section {
      margin-bottom: 28px;
    }
    h2 {
      font-size: 1.3rem;
      border-left: 4px solid #2563eb;
      padding-left: 10px;
      margin-bottom: 12px;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <header>
    <h1>매뉴얼 페이지</h1>
    <p class="lead">매뉴얼 페이지</p>
  </header>

  <main>
    <section>
      <h2>1. 개요</h2>
      <p>이 문서는 일반 사용자에게 안내할 매뉴얼의 기본 화면 예시입니다. 필요한 내용으로 본문을 수정해 사용하세요.</p>
    </section>

  </main>
</body>
</html>
